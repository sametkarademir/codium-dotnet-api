name: Release

# Publishes the template package to GitHub Packages when a version tag is pushed:
#   git tag v1.2.3 && git push origin v1.2.3
# The package version is taken from the tag (v1.2.3 -> 1.2.3).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not a valid version (expected vMAJOR.MINOR.PATCH[-suffix])"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  smoke:
    name: Template smoke
    needs: version
    uses: ./.github/workflows/template-smoke.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish to GitHub Packages
    needs: [version, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # The exact package that passed the smoke job.
      - uses: actions/download-artifact@v4
        with:
          name: template-package
          path: artifacts

      - name: Push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l artifacts
          dotnet nuget push "artifacts/Codium.Templates.$VERSION.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
