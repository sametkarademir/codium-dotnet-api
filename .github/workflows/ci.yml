name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/codium-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Codium.Template.sln

      - name: Build
        run: dotnet build Codium.Template.sln --configuration Release --no-restore

      # Unit tests need nothing; integration tests start a PostgreSQL container
      # through Testcontainers (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test Codium.Template.sln --configuration Release --no-build --verbosity normal

  functional_tests:
    name: Functional tests (Hurl parity)
    needs: build_and_test
    # Pinned: the Hurl 8.0.1 binary does not run on ubuntu-26.04 (current ubuntu-latest).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: templates/codium-api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: codium_service_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codium_service_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=codium_service_ci;User ID=postgres;Password=ci;"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5100
      Serilog__Console__MinimumLevel: Warning
      Hangfire__CronJobsEnabled: "false"
      # The parity files log in many times from one client; keep rate limiting enabled (switching it off breaks startup).
      RateLimiting__GlobalPolicy__PermitLimit: "1000000"
      RateLimiting__ApiPolicy__PermitLimit: "1000000"
      RateLimiting__AuthPolicy__PermitLimit: "1000000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Hurl
        uses: gacts/install-hurl@v1.3.2
        with:
          version: 8.0.1

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.0.14

      # The template ships no migrations: generate a throwaway one so the API can create the schema on a fresh database.
      - name: Generate a temporary migration
        run: |
          dotnet ef migrations add CiParity \
            -p src/Codium.Template.EntityFrameworkCore \
            -s src/Codium.Template.HttpApi.Host

      - name: Start the API
        run: |
          dotnet run --project src/Codium.Template.HttpApi.Host --no-launch-profile \
            > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for the API
        run: |
          timeout 180 bash -c '
            until curl -sf http://localhost:5100/openapi/v1.json >/dev/null 2>&1; do
              kill -0 "$(cat /tmp/api.pid)" 2>/dev/null || {
                echo "::error::API process exited early"
                tail -100 /tmp/api.log
                exit 1
              }
              sleep 2
            done'
          echo "API is ready."

      # Writes masked snapshots and fails when the API behavior differs from tests/parity/baseline.
      - name: Run Hurl parity tests
        run: |
          tests/parity/run.sh /tmp/parity-current
          diff -r tests/parity/baseline /tmp/parity-current

      - name: Upload snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-snapshots
          path: /tmp/parity-current/
          if-no-files-found: ignore

      - name: API log
        if: failure()
        run: tail -200 /tmp/api.log || true

      - name: Stop the API
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true

  # Packs the template, installs it like a user would, generates a project and checks it.
  # Catches renaming mistakes, leaked dev files and a broken generated project, which the
  # jobs above (they build the template sources themselves) cannot see.
  template_smoke:
    name: Template smoke (pack, generate, build)
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: Acme.Shop
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Pack the template
        run: dotnet pack Codium.Templates.csproj --configuration Release --output artifacts

      - name: Install the template from the package
        run: dotnet new install ./artifacts/Codium.Templates.*.nupkg

      - name: Generate a project
        run: dotnet new codium --name "$PROJECT_NAME" --output "$RUNNER_TEMP/generated"

      - name: Check the generated project contents
        working-directory: ${{ runner.temp }}/generated
        run: |
          fail=0
          for p in .claude .specify specs Codium.Template.sln; do
            if [ -e "$p" ]; then echo "::error::unexpected '$p' in generated project"; fail=1; fi
          done
          for p in "$PROJECT_NAME.sln" .gitignore .editorconfig global.json Directory.Build.props Directory.Packages.props .github/workflows/ci.yml; do
            if [ ! -e "$p" ]; then echo "::error::missing '$p' in generated project"; fail=1; fi
          done
          if grep -rIil --exclude-dir=bin --exclude-dir=obj codium .; then
            echo "::error::'codium' left over in the files listed above"; fail=1
          fi
          if grep -rIl --exclude-dir=bin --exclude-dir=obj 50488eb4944b1ede9c7e5db1af4dd5a0 .; then
            echo "::error::the sample JWT signing key was not replaced"; fail=1
          fi
          exit $fail

      - name: Build the generated project
        working-directory: ${{ runner.temp }}/generated
        run: dotnet build "$PROJECT_NAME.sln" --configuration Release

      - name: Run the generated project's unit tests
        working-directory: ${{ runner.temp }}/generated
        run: dotnet test "tests/$PROJECT_NAME.UnitTests" --configuration Release --no-build
